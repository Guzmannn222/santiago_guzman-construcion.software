# Server Configuration
server.port=${SERVER_PORT:8081}

# MySQL Configuration (auto-generated relational tables)
# Default: host-local run. Under Docker Compose use DB_URL=jdbc:mysql://mysql-db:3306/nexusmarket_db?... .
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/nexusmarket_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Auto Schema Generation
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# MongoDB Configuration (NoSQL audit trail)
# Spring Boot 4.x uses the spring.mongodb prefix (spring-boot-mongodb module).
# Default: host-local run. Under Docker Compose use MONGODB_URI=mongodb://mongo-db:27017/audit_db.
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/audit_db}

# Security & JWT Configuration
# Academic project default: a 32-char key to meet the HS256 256-bit minimum so the app runs out
# of the box. This value is PUBLIC (committed to source control): anyone can forge tokens against
# a deployment that keeps it. Override JWT_SECRET with your own random value outside coursework.
jwt.secret=${JWT_SECRET:NEXUSMARKETNEXUSMARKETNEXUSMARKET12}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}


# CORS: the front-end origin is read directly from the FRONTEND_ORIGIN environment variable by SecurityConfig.

# Business configuration (read through BusinessConfigurationPort)
business.invoice.default-tax-rate=${INVOICE_DEFAULT_TAX_RATE:0.19}
business.inventory.low-stock-threshold=${INVENTORY_LOW_STOCK_THRESHOLD:5}
